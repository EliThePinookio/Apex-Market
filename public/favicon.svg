<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- 3D Geometric Emerald Emblem -->
  <g filter="url(#softGlow)" transform="translate(106, 106)">
    <!-- Main Diamond / Polygon -->
    <path d="M150 20 L270 100 L270 230 L150 290 L30 230 L30 100 Z" fill="url(#emeraldGrad)"/>
    <path d="M150 20 L270 100 L150 160 L30 100 Z" fill="#34d399" opacity="0.6"/>
    <path d="M150 160 L270 100 L270 230 L150 290 Z" fill="#047857" opacity="0.4"/>
    <!-- Growth Arrow Accent -->
    <path d="M110 180 L150 120 L190 180 L165 180 L165 220 L135 220 L135 180 Z" fill="#ffffff"/>
  </g>
</svg>
